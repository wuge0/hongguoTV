name: 每日同步上游

on:
  schedule:
    # 每天 UTC 02:30 运行（对应北京时间 10:30）
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加并抓取上游
        run: |
          git remote add upstream https://github.com/N3urda/hongguoTV.git
          git fetch upstream --prune

      - name: 同步上游分支到本仓库
        run: |
          set -eux
          git fetch upstream --prune
          default_br=$(git rev-parse --abbrev-ref HEAD)
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/upstream); do
            br="${ref#refs/remotes/upstream/}"
            case "$br" in HEAD) continue ;; esac
            echo "=== 同步分支: $br ==="
            if git rev-parse -q --verify "refs/heads/$br" >/dev/null 2>&1; then
              if [ "$br" = "$default_br" ]; then
                # 默认分支：rebase 本地提交到上游最新之上，既保留本地修改又持续同步上游
                git checkout -q "$br"
                git rebase "refs/remotes/upstream/$br"
                git push --force-with-lease origin "$br"
                echo "OK: $br 已 rebase 到上游最新（保留本地提交）"
              elif git merge-base --is-ancestor "refs/heads/$br" "refs/remotes/upstream/$br"; then
                git push origin "refs/remotes/upstream/$br:refs/heads/$br"
                echo "OK: $br 已 fast-forward 到上游"
              else
                echo "SKIP: $br 与上游分叉，保留本地修改"
              fi
            else
              git push origin "refs/remotes/upstream/$br:refs/heads/$br"
              echo "OK: $br 已创建"
            fi
          done

      - name: 汇报结果
        if: always()
        run: |
          echo "本次同步完成。上游分支 main / codex/kotlin-standalone 已检查。"
